  <div class = "container-fluid gx-0 Inventory-BG">
    <main class = "row m-3 inventory-main-content">
      <section class = "col-12 col-sm-4 inventory-section">
        <div class = "row">
          <h1>Inventory</h1>
        </div>
        <div class = "row">
          <div class = "col-md-8 pe-md-0">
            <div class = "position-relative">
              <input class = "form-control me-2 add-ingredients-text w-100" type = "text" placeholder = "Search/Select Ingredient" aria-label = "Add Ingredient Text" id = "ingredient-search-box" autocomplete = "off">
              <div id = "ingredient-suggestions" class = "list-group position-absolute w-100 z-3" style = "max-height: 200px; overflow-y: auto;"></div>
            </div>
          </div>
          <div class = "col-md-4 ps-md-1">
            <button class = "btn btn-success add-ingredient-button w-100 mt-2 mt-md-0 mb-3 ms-0 ms-md-2" type = "button">Add</button>
          </div>
        </div>
        <div class = "row">
          <div class = "col-12">
            <button class = "btn btn-success suggest-recipes-button w-100" type = "button">Suggest Recipes</button>
          </div>
        </div>
        <div class = "row my-3">
          <div class = "col-6">
            <button class = "btn btn-success select-all-inventory-button w-100" type = "button">Select All Items</button>
          </div>
          <div class = "col-6">
            <button class = "btn btn-danger delete-all-inventory-button w-100" type = "button">Delete All Items</button>
          </div>
        </div>
        <div class = "row mt-3 mb-2">
          <div class = "col-12">
            <h5>Selected Ingredients: </h5>
            <div id = "selected-ingredients-div" class = "p-2">
              <em>No ingredients selected.</em>
            </div>
          </div>
        </div>
        <div class = "row inventory-list">
          <ul class="list-group list-group-flush pe-0 inventory-list-ul">
            <li class="list-group-item d-flex justify-content-between align-items-center inventory-list-item">
              <label class = "flex-grow-1 d-flex align-items-center" for = "inclineCheckbox1">
                <input type = "checkbox" class = "form-check-input flex-shrink-0 ingredient-checkbox me-2" id = "inlineCheckbox1" value = "option1">
                <span class = "text-wrap">
                  Cheese
                </span>
              </label>
              <button class = "btn btn-outline-danger delete-ingredeint-button ms-2" type = "button">x</button>
            </li>
          </ul>
        </div>
      </section>
      <section class = "col-12 col-sm-8 results-section">
        <div class = "row row-cols-1 row-cols-md-2 row-cols-lg-3 results-cards-container">
        </div>
      </section>
